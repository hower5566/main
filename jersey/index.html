<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>球衣名字產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: a workbench — controls in a left rail, a rack of jersey proofs on the right, one export bar on top. */
:root{
  --bg:#EEF1F6; --panel:#FFFFFF; --ink:#152038; --muted:#5A6580; --line:#D6DCE7;
  --jersey:#24477F; --trim:#FBFBF7; --accent:#1F55B8; --accent-ink:#FFFFFF;
  --warn:#B7600F; --warn-bg:#FCEFE0; --bad:#B42318; --bad-bg:#FCE7E5; --ok:#23704A; --ok-bg:#E3F3EA;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --panel:#18202F; --ink:#E8EDF7; --muted:#9AA6BF; --line:#2B3548;
  --jersey:#2E5596; --trim:#F2F2EC; --accent:#6E9BEA; --accent-ink:#0D1424;
  --warn:#F0A660; --warn-bg:#3A2A16; --bad:#F2867C; --bad-bg:#3B1C1A; --ok:#7FD1A6; --ok-bg:#163126; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --panel:#18202F; --ink:#E8EDF7; --muted:#9AA6BF; --line:#2B3548;
  --jersey:#2E5596; --trim:#F2F2EC; --accent:#6E9BEA; --accent-ink:#0D1424;
  --warn:#F0A660; --warn-bg:#3A2A16; --bad:#F2867C; --bad-bg:#3B1C1A; --ok:#7FD1A6; --ok-bg:#163126; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.5vw,40px);line-height:1;letter-spacing:.02em;margin:0;text-wrap:balance}
h1 small{display:block;font-family:var(--f-body);font-weight:500;font-size:14px;letter-spacing:0;color:var(--muted);margin-top:8px}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:focus-visible,.mini:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}
.rail{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:.03em;text-transform:uppercase}
.hint{color:var(--muted);font-size:12.5px;margin:0}
textarea{width:100%;min-height:170px;resize:vertical;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--ink);font-family:var(--f-mono);font-size:13.5px;line-height:1.7}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.row label{font-weight:500}
.row output,.unit{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:58px;text-align:right}
.row input[type=range]{grid-column:1 / -1;width:100%;accent-color:var(--accent)}
select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--bg);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:center;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
details summary{cursor:pointer;font-weight:700;color:var(--muted)}
details[open] summary{margin-bottom:10px}
.rack{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card svg{width:100%;height:auto;display:block}
.card .who{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .who b{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:.03em;overflow-wrap:anywhere}
.card .who span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;font-weight:500}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.mini{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px;font-weight:700;font-size:12.5px}
.mini:disabled{opacity:.45}
.empty{color:var(--muted);padding:30px;text-align:center;border:1.5px dashed var(--line);border-radius:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:500;max-width:calc(100vw - 32px);text-align:center;z-index:9}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.upl label.mini{cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>球衣名字產生器<small>60 mm 籃球衣吊飾 · 名字微弧排列 · 每人一個 STL，對齊空白球衣直接匯入 Bambu Studio</small></h1>
    <div class="actions">
      <span class="status" id="status">準備中…</span>
      <button class="btn" id="dlAll" disabled>下載全部 STL</button>
    </div>
  </header>

  <div class="grid">
    <div class="rail">
      <section class="panel">
        <h2>名單</h2>
        <textarea id="list" spellcheck="false" aria-label="名單，每行一個人"></textarea>
        <p class="hint">每行一個人：<b>名字, 號碼</b>。逗號或空白都可以，只寫名字或只寫號碼也行。下面是範例名單，貼上你的名單取代即可。</p>
      </section>

      <section class="panel">
        <h2>字體</h2>
        <div><label for="fFont">名字和號碼共用同一個字體</label><select id="fFont"></select></div>
        <div class="upl">
          <label class="mini" for="fFile">上傳字體檔（.ttf / .otf）</label>
          <input type="file" id="fFile" accept=".ttf,.otf,.woff,font/ttf,font/otf,font/woff" hidden>
          <span class="hint" id="fFileNote">例如 Jersey M54。上傳一次，這台裝置會記住。</span>
        </div>
        <label class="check"><input type="checkbox" id="upper" checked> 名字自動轉大寫</label>
      </section>

      <section class="panel">
        <h2>名字</h2>
        <div class="row"><label for="nCap">字高</label><output id="nCapO"></output><input type="range" id="nCap" min="3" max="8" step="0.1" value="5"></div>
        <div class="row"><label for="arc">弧度</label><output id="arcO"></output><input type="range" id="arc" min="0" max="100" step="1" value="55"></div>
        <div class="row"><label for="nSp">字距</label><output id="nSpO"></output><input type="range" id="nSp" min="-0.5" max="2" step="0.05" value="0.3"></div>
        <div class="row"><label for="nMax">最大寬度（太長自動縮小）</label><output id="nMaxO"></output><input type="range" id="nMax" min="16" max="32" step="0.5" value="26"></div>
        <div class="row"><label for="nY">上下位置</label><output id="nYO"></output><input type="range" id="nY" min="32" max="46" step="0.1" value="39"></div>
      </section>

      <section class="panel">
        <h2>號碼</h2>
        <div class="row"><label for="mCap">字高</label><output id="mCapO"></output><input type="range" id="mCap" min="10" max="22" step="0.5" value="18"></div>
        <div class="row"><label for="mSp">字距</label><output id="mSpO"></output><input type="range" id="mSp" min="-1" max="3" step="0.1" value="0.6"></div>
        <div class="row"><label for="mMax">最大寬度</label><output id="mMaxO"></output><input type="range" id="mMax" min="14" max="36" step="0.5" value="30"></div>
        <div class="row"><label for="mY">上下位置</label><output id="mYO"></output><input type="range" id="mY" min="14" max="32" step="0.1" value="23"></div>
      </section>

      <section class="panel">
        <details>
          <summary>列印細節（進階）</summary>
          <div style="display:flex;flex-direction:column;gap:12px">
            <div class="row"><label for="bold">筆畫加粗</label><output id="boldO"></output><input type="range" id="bold" min="0" max="0.4" step="0.01" value="0.12"></div>
            <div class="row"><label for="minCap">名字最小字高</label><output id="minCapO"></output><input type="range" id="minCap" min="2.5" max="5" step="0.1" value="3.6"></div>
            <div class="row"><label for="zTop">字的頂面高度</label><output id="zTopO"></output><input type="range" id="zTop" min="2.4" max="4" step="0.1" value="3"></div>
            <div class="row"><label for="fil">字頂圓角</label><output id="filO"></output><input type="range" id="fil" min="0" max="0.5" step="0.05" value="0.3"></div>
            <p class="hint">字從球衣藍色表面（2.0 mm）長到頂面高度。預設 3.0 mm，跟白色滾邊一樣高。</p>
          </div>
        </details>
      </section>
    </div>

    <section style="display:flex;flex-direction:column;gap:12px;min-width:0">
      <div class="legend"><span><i style="background:var(--ok-bg);outline:1px solid var(--ok)"></i>可直接列印</span><span><i style="background:var(--warn-bg);outline:1px solid var(--warn)"></i>已自動調整，建議看一下</span><span><i style="background:var(--bad-bg);outline:1px solid var(--bad)"></i>需要處理</span></div>
      <div class="rack" id="rack"><div class="empty">字型載入中…</div></div>
    </section>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<script src="https://cdn.jsdelivr.net/npm/earcut@2.2.4/dist/earcut.min.js"></script>
<script>
/* Jersey lettering core: font -> arched 2D outline -> filleted 3D solid -> binary STL.
   Works in the browser (globals opentype, ClipperLib, earcut) and in Node (passed in). */
(function (root) {
  'use strict';
  var CS = 1000; // clipper integer scale: 1 unit = 1 micron

  function makeCore(opentype, ClipperLib, earcut) {

    function capHeightUnits(font) {
      var os2 = font.tables.os2;
      if (os2 && os2.sCapHeight) return os2.sCapHeight;
      var g = font.charToGlyph('H'); var bb = g.getBoundingBox(); return bb.y2 - bb.y1;
    }

    // flatten one glyph path (opentype units scaled to mm, y up) into closed contours
    function glyphContours(glyph, scale, upm) {
      var cmds = glyph.getPath(0, 0, upm).commands; // fontSize = unitsPerEm -> coordinates in font units (y down)
      var out = [], cur = null, px = 0, py = 0;
      function P(x, y) { return [x * scale, -y * scale]; }
      cmds.forEach(function (c) {
        if (c.type === 'M') { if (cur && cur.length > 2) out.push(cur); cur = [P(c.x, c.y)]; px = c.x; py = c.y; }
        else if (c.type === 'L') { cur.push(P(c.x, c.y)); px = c.x; py = c.y; }
        else if (c.type === 'Q') {
          for (var i = 1; i <= 8; i++) { var t = i / 8, a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, d = t * t;
            cur.push(P(a * px + b * c.x1 + d * c.x, a * py + b * c.y1 + d * c.y)); }
          px = c.x; py = c.y;
        } else if (c.type === 'C') {
          for (var j = 1; j <= 10; j++) { var s = j / 10, u = 1 - s;
            cur.push(P(u*u*u*px + 3*u*u*s*c.x1 + 3*u*s*s*c.x2 + s*s*s*c.x, u*u*u*py + 3*u*u*s*c.y1 + 3*u*s*s*c.y2 + s*s*s*c.y)); }
          px = c.x; py = c.y;
        } else if (c.type === 'Z') { if (cur && cur.length > 2) out.push(cur); cur = null; }
      });
      if (cur && cur.length > 2) out.push(cur);
      return out;
    }

    /* Lay text on an arc.
       opts: text, font, capH (mm), arcR (mm radius of the baseline arc, 0 = straight; same radius for every name,
       so short names get a gentle curve and long names a stronger one), spacing (mm extra per gap), squeeze (x scale 0..1)
       returns {contours:[[x,y]...], width, height} centred on x=0 with the arc's centre baseline at y=0 */
    function layout(font, text, capH, arcR, spacing, squeeze) {
      var upm = font.unitsPerEm;
      var scale = capH / capHeightUnits(font);        // mm per font unit
      var glyphs = font.stringToGlyphs(text);
      var items = [], x = 0;
      for (var i = 0; i < glyphs.length; i++) {
        var g = glyphs[i];
        var adv = (g.advanceWidth || 0) * scale * squeeze;
        if (i > 0) { x += (font.getKerningValue(glyphs[i - 1], g) || 0) * scale * squeeze + spacing; }
        items.push({ g: g, x0: x, adv: adv });
        x += adv;
      }
      var L = x, half = L / 2;
      var R = arcR > 0.5 ? arcR : 0;
      var contours = [];
      items.forEach(function (it) {
        var cs = glyphContours(it.g, scale, upm); // font units -> mm
        var cx = it.x0 + it.adv / 2 - half;          // glyph centre along the baseline
        var th = R ? cx / R : 0;
        var bx = R ? R * Math.sin(th) : cx;
        var by = R ? R * Math.cos(th) - R : 0;
        var ct = Math.cos(-th), st = Math.sin(-th);
        cs.forEach(function (c) {
          contours.push(c.map(function (p) {
            var lx = (p[0] * squeeze) - (it.adv / 2), ly = p[1];   // glyph-local, centred
            // squeeze applied to glyph x; adv already includes squeeze
            lx = p[0] * squeeze - it.adv / 2;
            return [bx + lx * ct - ly * st, by + lx * st + ly * ct];
          }));
        });
      });
      // bounds
      var minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
      contours.forEach(function (c) { c.forEach(function (p) {
        if (p[0] < minx) minx = p[0]; if (p[0] > maxx) maxx = p[0]; if (p[1] < miny) miny = p[1]; if (p[1] > maxy) maxy = p[1]; }); });
      return { contours: contours, minx: minx, maxx: maxx, miny: miny, maxy: maxy, width: maxx - minx, height: maxy - miny };
    }

    /* Fit text into maxW: shrink cap height down to minCap, then squeeze glyphs down to minSqueeze. */
    function fit(font, text, o) {
      var cap = o.capH, sq = 1, lay = layout(font, text, cap, o.arcR, o.spacing, sq), note = [];
      if (!text) return { lay: lay, cap: cap, squeeze: 1, notes: note, over: 0 };
      if (lay.width > o.maxW) {
        cap = Math.max(o.minCap, o.capH * o.maxW / lay.width);
        for (var k = 0; k < 4; k++) { lay = layout(font, text, cap, o.arcR, o.spacing, sq); if (lay.width <= o.maxW || cap <= o.minCap) break; cap = Math.max(o.minCap, cap * o.maxW / lay.width); }
        if (cap < o.capH - 0.01) note.push('shrunk');
      }
      if (lay.width > o.maxW + 0.01) {
        sq = Math.max(o.minSqueeze, o.maxW / lay.width);
        for (var j = 0; j < 4; j++) { lay = layout(font, text, cap, o.arcR, o.spacing, sq); if (lay.width <= o.maxW || sq <= o.minSqueeze) break; sq = Math.max(o.minSqueeze, sq * o.maxW / lay.width); }
        note.push('squeezed');
      }
      return { lay: lay, cap: cap, squeeze: sq, notes: note, over: Math.max(0, lay.width - o.maxW) };
    }

    function toClip(contours, dx, dy) {
      return contours.map(function (c) { return c.map(function (p) { return { X: Math.round((p[0] + dx) * CS), Y: Math.round((p[1] + dy) * CS) }; }); });
    }
    function union(paths) {
      var c = new ClipperLib.Clipper(); c.AddPaths(paths, ClipperLib.PolyType.ptSubject, true);
      var sol = new ClipperLib.Paths();
      c.Execute(ClipperLib.ClipType.ctUnion, sol, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero);
      return sol;
    }
    function offsetTree(paths, delta) {
      var co = new ClipperLib.ClipperOffset(2, 0.02 * CS);
      co.AddPaths(paths, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon);
      var tree = new ClipperLib.PolyTree(); co.Execute(tree, delta * CS); return tree;
    }
    function offsetPaths(paths, delta) {
      if (Math.abs(delta) < 1e-6) return paths;
      var co = new ClipperLib.ClipperOffset(2, 0.02 * CS);
      co.AddPaths(paths, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon);
      var sol = new ClipperLib.Paths(); co.Execute(sol, delta * CS); return sol;
    }
    // PolyTree -> [{outer:[[x,y]..], holes:[[[x,y]..]..]}] in mm
    function shapes(tree) {
      var res = [];
      function mm(path) {
        var out = [];
        path.forEach(function (p) {
          var q = [p.X / CS, p.Y / CS], l = out[out.length - 1];
          if (!l || Math.abs(l[0] - q[0]) > 0.002 || Math.abs(l[1] - q[1]) > 0.002) out.push(q);
        });
        while (out.length > 2) {
          var f = out[0], e = out[out.length - 1];
          if (Math.abs(f[0] - e[0]) <= 0.002 && Math.abs(f[1] - e[1]) <= 0.002) out.pop(); else break;
        }
        return out;
      }
      function walk(node) {
        node.Childs().forEach(function (ch) {
          if (!ch.IsHole()) {
            var s = { outer: mm(ch.Contour()), holes: [] };
            ch.Childs().forEach(function (h) { s.holes.push(mm(h.Contour())); walk(h); });
            res.push(s);
          }
        });
      }
      walk(tree);
      return res.filter(function (s) { return s.outer.length > 2; });
    }
    function area(r) { var a = 0; for (var i = 0, n = r.length; i < n; i++) { var p = r[i], q = r[(i + 1) % n]; a += p[0] * q[1] - q[0] * p[1]; } return a / 2; }

    // closed prism of a shape set between z0 and z1 -> pushes triangles [[x,y,z]x3]
    function prism(shs, z0, z1, tris) {
      shs.forEach(function (s) {
        var outer = area(s.outer) > 0 ? s.outer : s.outer.slice().reverse();
        var holes = s.holes.map(function (h) { return area(h) < 0 ? h : h.slice().reverse(); });
        var flat = [], holeIdx = [], pts = [];
        outer.forEach(function (p) { flat.push(p[0], p[1]); pts.push(p); });
        holes.forEach(function (h) { holeIdx.push(pts.length); h.forEach(function (p) { flat.push(p[0], p[1]); pts.push(p); }); });
        var idx = earcut(flat, holeIdx.length ? holeIdx : null, 2);
        for (var i = 0; i < idx.length; i += 3) {
          var a = pts[idx[i]], b = pts[idx[i + 1]], c = pts[idx[i + 2]];
          var ccw = (b[0] - a[0]) * (c[1] - a[1]) - (b[1] - a[1]) * (c[0] - a[0]) > 0;
          if (!ccw) { var t = b; b = c; c = t; }
          tris.push([[a[0], a[1], z1], [b[0], b[1], z1], [c[0], c[1], z1]]);   // top, +z
          tris.push([[a[0], a[1], z0], [c[0], c[1], z0], [b[0], b[1], z0]]);   // bottom, -z
        }
        [outer].concat(holes).forEach(function (r) {
          for (var k = 0, n = r.length; k < n; k++) {
            var p = r[k], q = r[(k + 1) % n];
            tris.push([[p[0], p[1], z0], [q[0], q[1], z0], [q[0], q[1], z1]]);
            tris.push([[p[0], p[1], z0], [q[0], q[1], z1], [p[0], p[1], z1]]);
          }
        });
      });
    }

    /* Build one person's lettering.
       cfg: {fonts:{name,number}, name, number, nameOpt, numOpt, bold, zBase, zTop, fillet, steps}
       returns {tris, base2d (shapes at full size), info} */
    function build(cfg) {

var FONT_LIST=[
  {id:'Graduate',label:'Graduate（大學球衣風）'},
  {id:'Alfa Slab One',label:'Alfa Slab One（粗襯線）'},
  {id:'Anton',label:'Anton（窄粗黑，適合長名字）'},
  {id:'Bebas Neue',label:'Bebas Neue（細長無襯線）'}
];
var SAMPLE='WANG, 7\nCHEN, 23\nLIN, 10\nHUANG, 0\nWASHINGTON, 32\nLI, 8';
var $=function(id){return document.getElementById(id)};
var CUSTOM_KEY='jerseyGenFont';
var fonts={}, Core=null, results=[], downloads=true, busy=false;

function toast(t){var o=document.querySelector('.toast');if(o)o.remove();var el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(function(){el.remove()},3000)}
function b64buf(s){var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}

// ---- controls
var NUMS={nCap:['mm',1],arc:['',0],nSp:['mm',2],nMax:['mm',1],nY:['mm',1],mCap:['mm',1],mSp:['mm',1],mMax:['mm',1],mY:['mm',1],bold:['mm',2],minCap:['mm',1],zTop:['mm',1],fil:['mm',2]};
function val(id){return parseFloat($(id).value)}
function arcRadius(){var p=val('arc');return p<=0?0:18/(p/100)} // 100% -> R 18 mm (strong), 50% -> 36 mm
function showOutputs(){Object.keys(NUMS).forEach(function(k){var o=$(k+'O');if(!o)return;
  if(k==='arc'){var R=arcRadius();o.textContent=R?('R '+R.toFixed(0)+' mm'):'直線';return}
  o.textContent=val(k).toFixed(NUMS[k][1])+' '+NUMS[k][0]})}
function settings(){
  return {
    fonts:{name:fonts[$('fFont').value],number:fonts[$('fFont').value]},
    bold:val('bold'),zBase:2.0,zTop:val('zTop'),fillet:val('fil'),steps:4,
    nameOpt:{capH:val('nCap'),minCap:Math.min(val('minCap'),val('nCap')),maxW:val('nMax'),arcR:arcRadius(),spacing:val('nSp'),minSqueeze:0.7,y:val('nY')},
    numOpt:{capH:val('mCap'),minCap:Math.min(10,val('mCap')),maxW:val('mMax'),arcR:0,spacing:val('mSp'),minSqueeze:0.8,y:val('mY')}
  };
}
try{var saved=JSON.parse(localStorage.getItem('jerseyGen')||'null');}catch(e){saved=null}

function parseList(){
  var up=$('upper').checked;
  return $('list').value.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean).map(function(l){
    var m=l.match(/^(.*?)[\s,，、\t]+(\d{1,3})$/); var name,num;
    if(m){name=m[1].trim();num=m[2]} else if(/^\d{1,3}$/.test(l)){name='';num=l} else {name=l;num=''}
    name=name.replace(/[,，、]+$/,'').trim(); if(up)name=name.toUpperCase();
    // keep characters the fonts contain
    var bad=name.replace(/[ -~]/g,'');
    name=name.replace(/[^ -~]/g,'');
    var f=fonts[$('fFont').value];
    if(f){var miss=(name+num).split('').filter(function(ch){return ch!==' '&&f.charToGlyph(ch).index===0});
      if(miss.length){bad+=miss.join('');var drop=new RegExp('['+miss.map(function(ch){return ch.replace(/[\\\]^-]/g,'\\$&')}).join('')+']','g');name=name.replace(drop,'');num=num.replace(drop,'')}}
    return {name:name,num:num,unsupported:bad};
  });
}

// ---- preview svg
function ringPath(r){return 'M'+r.map(function(p){return p[0].toFixed(2)+' '+(61-p[1]).toFixed(2)}).join('L')+'Z'}
var JERSEY_SVG='<path d="'+ringPath(SHAPE.outline)+'" fill="var(--jersey)"/>'+SHAPE.trims.map(function(t){return '<path d="'+ringPath(t)+'" fill="var(--trim)"/>'}).join('');
function svgFor(base){
  var d=base.map(function(s){return ringPath(s.outer)+s.holes.map(ringPath).join('')}).join('');
  return '<svg viewBox="-25.5 -0.5 51 62" role="img" aria-label="球衣預覽">'+JERSEY_SVG+'<path d="'+d+'" fill="var(--trim)" fill-rule="evenodd"/></svg>';
}
function chipsFor(r,p){
  var c=[],i=r.info;
  if(p.unsupported)c.push(['bad','略過不支援的字：'+p.unsupported]);
  if(i.name){
    if(i.name.over>0.05)c.push(['bad','名字太長，超出 '+i.name.over.toFixed(1)+' mm（換 Anton 或加大最大寬度）']);
    else if(i.name.notes.indexOf('squeezed')>=0)c.push(['warn','名字壓窄到 '+Math.round(i.name.squeeze*100)+'%']);
    if(i.name.notes.indexOf('shrunk')>=0)c.push(['warn','名字縮小到 '+i.name.cap.toFixed(1)+' mm']);
  }
  if(i.number&&i.number.over>0.05)c.push(['bad','號碼太寬，超出 '+i.number.over.toFixed(1)+' mm']);
  else if(i.number&&i.number.notes.length)c.push(['warn','號碼縮到 '+i.number.cap.toFixed(1)+' mm']);
  if(i.thinLoss>0.12)c.push(['bad','部分筆畫太細，請加粗或換 Anton']);
  else if(i.thinLoss>0.05)c.push(['warn','少數筆畫偏細']);
  if(!c.length)c.push(['ok','可直接列印']);
  return c;
}
function fileName(i,p){var n=(p.name||'').replace(/[^A-Za-z0-9-]+/g,'_').replace(/^_+|_+$/g,'');return String(i+1).padStart(2,'0')+(n?'_'+n:'')+(p.num?'_'+p.num:'')+'.stl'}

var timer=null;
function schedule(){showOutputs();clearTimeout(timer);timer=setTimeout(render,120);try{localStorage.setItem('jerseyGen',JSON.stringify(snapshot()))}catch(e){}}
function snapshot(){var s={list:$('list').value,fFont:$('fFont').value,upper:$('upper').checked};Object.keys(NUMS).forEach(function(k){s[k]=$(k).value});return s}
function render(){
  if(!Core)return;
  var people=parseList(), st=settings(), rack=$('rack');
  results=[];
  if(!people.length){rack.innerHTML='<div class="empty">名單是空的。在左邊輸入「名字, 號碼」，一行一個人。</div>';updateBar();return}
  var html='',bad=0,warn=0;
  people.forEach(function(p,i){
    var r=Core.build(Object.assign({},st,{name:p.name,number:p.num}));
    results.push({p:p,r:r,file:fileName(i,p)});
    var chips=chipsFor(r,p); if(chips.some(function(c){return c[0]==='bad'}))bad++; else if(chips.some(function(c){return c[0]==='warn'}))warn++;
    html+='<article class="card">'+svgFor(r.base)+
      '<div class="who"><b>'+(p.name?escapeHtml(p.name):'（無名字）')+'</b><span>#'+(p.num||'—')+'</span></div>'+
      '<div class="chips">'+chips.map(function(c){return '<span class="chip '+c[0]+'">'+escapeHtml(c[1])+'</span>'}).join('')+'</div>'+
      '<div><button class="mini" data-one="'+i+'"'+(downloads?'':' disabled')+'>下載這件</button></div></article>';
  });
  rack.innerHTML=html;
  $('status').textContent=people.length+' 件'+(bad?' · '+bad+' 件需要處理':'')+(warn?' · '+warn+' 件已自動調整':'');
  updateBar();
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function updateBar(){$('dlAll').disabled=!(downloads&&results.length)||busy}

function dl(it){
  var blob=new Blob([Core.stl(it.r.tris,(it.p.name||'')+' '+(it.p.num||''))],{type:'model/stl'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=it.file;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},10000);
}
async function save(items){
  if(busy||!items.length)return; busy=true; updateBar();
  try{
    for(var i=0;i<items.length;i++){dl(items[i]);if(i<items.length-1)await new Promise(function(r){setTimeout(r,350)})}
    toast(items.length>1?'已下載 '+items.length+' 個 STL（瀏覽器若問「允許下載多個檔案」，請按允許）':'已下載 '+items[0].file);
  }catch(e){toast('下載失敗，請再試一次')}
  busy=false; updateBar();
}
$('dlAll').addEventListener('click',function(){save(results)});
$('rack').addEventListener('click',function(e){var b=e.target.closest('[data-one]');if(!b)return;var it=results[+b.getAttribute('data-one')];save([it])});

// ---- custom font upload
function fontLabel(f){var n=f.names||{};var g=function(k){return n[k]&&(n[k].en||n[k][Object.keys(n[k])[0]])};return g('fullName')||g('fontFamily')||'自訂字體'}
function addCustom(label,buf){var f=opentype.parse(buf);if(!f.charToGlyph('H').index)throw new Error('no H');fonts.custom=f;FONT_LIST=FONT_LIST.filter(function(x){return x.id!=='custom'});FONT_LIST.unshift({id:'custom',label:label+'（上傳的字體）'});return f}
function fillFonts(){$('fFont').innerHTML=FONT_LIST.map(function(f){return '<option value="'+f.id+'">'+escapeHtml(f.label)+'</option>'}).join('')}
function bufB64(buf){var u=new Uint8Array(buf),s='';for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function onFontFile(e){
  var file=e.target.files&&e.target.files[0]; e.target.value=''; if(!file)return;
  if(/\.woff2$/i.test(file.name)){toast('不支援 .woff2，請改用 .ttf 或 .otf');return}
  file.arrayBuffer().then(function(buf){
    var label; try{var f=opentype.parse(buf.slice(0));label=fontLabel(f);addCustom(label,buf.slice(0))}catch(err){toast('這個檔案讀不出來，請換 .ttf 或 .otf');return}
    try{localStorage.setItem(CUSTOM_KEY,JSON.stringify({label:label,b64:bufB64(buf)}))}catch(err){toast('已套用 '+label+'，但這台裝置記不住，下次要重新上傳')}
    fillFonts(); $('fFont').value='custom'; $('fFileNote').textContent='目前使用：'+label; schedule(); toast('已套用 '+label);
  });
}

// ---- boot
function boot(){
  if(!(window.opentype&&window.ClipperLib&&window.earcut)){$('rack').innerHTML='<div class="empty">程式庫載入失敗。請重新整理頁面。</div>';$('status').textContent='載入失敗';return}
  Core=JerseyCore(window.opentype,window.ClipperLib,window.earcut);
  FONT_LIST.forEach(function(f){fonts[f.id]=opentype.parse(b64buf(FONT_B64[f.id]))});
  var custom=null; try{custom=JSON.parse(localStorage.getItem(CUSTOM_KEY)||'null')}catch(e){}
  if(custom){try{addCustom(custom.label,b64buf(custom.b64))}catch(e){custom=null}}
  fillFonts(); if(custom)$('fFileNote').textContent='目前使用：'+custom.label;
  $('fFont').value=custom?'custom':'Graduate'; $('list').value=SAMPLE;
  if(saved&&saved.fFont&&!fonts[saved.fFont])delete saved.fFont;
  if(saved){try{Object.keys(saved).forEach(function(k){var el=$(k);if(!el)return;if(el.type==='checkbox')el.checked=!!saved[k];else el.value=saved[k]})}catch(e){}}
  $('fFile').addEventListener('change',onFontFile);
  document.querySelectorAll('input:not([type=file]),select,textarea').forEach(function(el){el.addEventListener('input',schedule);el.addEventListener('change',schedule)});
  showOutputs(); render();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})();
</script>
